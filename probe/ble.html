<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FM-1 · BLE-MIDI probe</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; padding:14px 14px 40px; background:#14161a; color:#e6e8ec;
         font:15px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace; }
  h1 { font-size:17px; margin:0 0 4px; }
  .note { color:#9aa3b2; font-size:12.5px; margin:0 0 14px; }
  .row { display:flex; flex-wrap:wrap; gap:8px; margin:0 0 10px; }
  button { flex:1 1 auto; min-height:48px; padding:10px 12px; border-radius:10px;
           border:1px solid #333a46; background:#1e2229; color:#e6e8ec;
           font:inherit; font-size:13.5px; }
  button:disabled { opacity:.4; }
  button.primary { background:#1d4ed8; border-color:#1d4ed8; }
  button.warn { background:#7f1d1d; border-color:#7f1d1d; }
  input { width:7.5em; min-height:40px; padding:6px 8px; border-radius:8px;
          border:1px solid #333a46; background:#1e2229; color:#e6e8ec; font:inherit; }
  pre { margin:0; padding:10px; height:52vh; overflow:auto; white-space:pre-wrap;
        word-break:break-all; background:#0d0f12; border:1px solid #262c36;
        border-radius:10px; font-size:12px; }
  .tx { color:#7dd3fc; } .rx { color:#86efac; } .err { color:#fca5a5; }
  .ok  { color:#86efac; font-weight:700; } .hi { color:#fde68a; }
  .dim { color:#6b7280; }
</style>
</head>
<body>
<h1>FM-1 · BLE-MIDI probe</h1>
<p class="note">
  Throwaway verification page — answers <b>R1</b> (does BLE route the proprietary
  <code>0x11</code>/<code>0x20</code> SysEx?) and <b>R2</b> (does a 177-byte write survive?).
  It does not touch the app. Plan: <code>notes/BLUETOOTH-PLAN.md</code>.
</p>

<div class="row">
  <button id="connect" class="primary">1 · Connect Bluetooth</button>
  <button id="connectAll">Connect (show all devices)</button>
  <button id="disconnect" disabled>Disconnect</button>
</div>

<div class="row">
  <button id="note" disabled>2 · Note on/off (sanity)</button>
  <button id="read" disabled>3 · Read SysEx 0x11 &nbsp;<input id="addr" value="0"> <input id="rlen" value="16"></button>
</div>

<div class="row">
  <button id="write" class="warn" disabled>4 · 0x20 write — volatile (RAM only)</button>
  <button id="writeSave" class="warn" disabled>5 · 0x20 write + SAVE → slot 15</button>
</div>

<div class="row">
  <button id="clear">Clear log</button>
  <button id="diag">Diagnostics</button>
</div>

<pre id="log"></pre>

<script type="module">
import {
  SERVICE_UUID, IO_CHAR_UUID,
  packetize, readMsg, testPattern,
  createSysexReassembler, decodeReply,
} from './encode.js';

let device = null, ioChar = null, replyTimer = null;

const $ = (id) => document.getElementById(id);
const logEl = $('log');
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

function log(msg, cls) {
  const t = new Date().toISOString().slice(11, 23);
  const line = document.createElement('div');
  if (cls) line.className = cls;
  line.textContent = t + '  ' + msg;
  logEl.appendChild(line);
  logEl.scrollTop = logEl.scrollHeight;
}
const hex = (b) => Array.from(b, (x) => x.toString(16).padStart(2, '0').toUpperCase()).join(' ');

/* ------------------- inbound: BLE framing -> SysEx reassembly ------------ */
const STATUS = {
  0: 'done', 1: 'value out of range', 2: 'damaged in transit',
  3: "the FM-1's sequencer is playing",
};

function emitSysex(sx) {
  log('\u2190 SysEx ' + sx.length + ' B \u2014 ' + hex(sx), 'rx');
  const d = decodeReply(sx);
  if (!d) { log('  (not an F0 7D reply \u2014 unrecognised)', 'dim'); return; }
  const kind = { 0x50: 'sound', 0x51: 'mem', 0x52: 'pattern' }[d.kind] || ('0x' + d.kind.toString(16));
  log('  kind=' + kind + '  status=' + d.status + ' (' + (STATUS[d.status] || 'refused') + ')' +
      '  arg=0x' + d.arg.toString(16) + '  len=' + d.len,
      d.status === 0 ? 'ok' : 'hi');
  if (replyTimer) { clearTimeout(replyTimer); replyTimer = null; }
}

const feedPacket = createSysexReassembler(emitSysex);

/* ------------------------------- transport ------------------------------- */
async function send(midiBytes, label) {
  const pkts = packetize(midiBytes);
  log('\u2192 ' + label + ': ' + midiBytes.length + ' MIDI B \u2192 ' + pkts.length +
      ' BLE packet(s)  ' + hex(midiBytes.slice(0, 12)) + (midiBytes.length > 12 ? ' \u2026' : ''), 'tx');
  if (replyTimer) clearTimeout(replyTimer);
  replyTimer = setTimeout(() => { log('  \u26a0 no reply within 4 s', 'err'); replyTimer = null; }, 4000);
  for (const p of pkts) {
    if (ioChar.properties.writeWithoutResponse) await ioChar.writeValueWithoutResponse(p);
    else await ioChar.writeValue(p);
    if (pkts.length > 1) await sleep(14);      // BLE conn interval 7.5-30 ms
  }
}

/* ------------------------------ connection ------------------------------- */
function setConnected(on) {
  if (device) $('disconnect').disabled = !on;
  for (const id of ['note', 'read', 'write', 'writeSave']) $(id).disabled = !on;
  $('connect').disabled = on;
  $('connectAll').disabled = on;
}

async function connect(withFilter) {
  try {
    log('requesting device \u2026' + (withFilter ? '  filters: namePrefix FM-1 / FM- / M-VAVE' : '  (no filter \u2014 all devices)'), 'dim');
    const opts = withFilter
      ? { filters: [{ namePrefix: 'FM-1' }, { namePrefix: 'FM-' }, { namePrefix: 'M-VAVE' }],
          optionalServices: [SERVICE_UUID] }
      : { acceptAllDevices: true, optionalServices: [SERVICE_UUID] };
    device = await navigator.bluetooth.requestDevice(opts);
    log('device: ' + (device.name || '(unnamed)') + '  id=' + device.id);
    device.addEventListener('gattserverdisconnected', () => {
      log('\u26a0 GATT disconnected', 'err'); ioChar = null; setConnected(false);
    });

    const server = await device.gatt.connect();
    log('GATT connected \u2014 enumerating services \u2026', 'ok');

    for (const s of await server.getPrimaryServices()) {
      log('  service ' + s.uuid);
      try {
        for (const c of await s.getCharacteristics()) {
          const pr = [];
          for (const k of ['read', 'write', 'writeWithoutResponse', 'notify', 'indicate'])
            if (c.properties[k]) pr.push(k);
          log('    char ' + c.uuid + '   [' + pr.join(', ') + ']');
        }
      } catch (e) { log('    (chars unavailable: ' + e.message + ')', 'dim'); }
    }

    const svc = await server.getPrimaryService(SERVICE_UUID);
    ioChar = await svc.getCharacteristic(IO_CHAR_UUID);
    log('BLE-MIDI I/O characteristic acquired \u2014 starting notifications', 'ok');
    ioChar.addEventListener('characteristicvaluechanged', (e) => {
      const d = new Uint8Array(e.target.value.buffer);
      log('\u2190 notify ' + d.length + ' B: ' + hex(d), 'rx');
      feedPacket(d);
    });
    await ioChar.startNotifications();
    setConnected(true);
    log('\u2705 ready \u2014 run 2, then 3 (R1), then 4 / 5 (R2)', 'ok');
  } catch (e) {
    log('\u2716 ' + e.name + ': ' + e.message, 'err');
    log('  if this says "already connected", toggle the FM-1 BT off/on so it advertises.', 'dim');
  }
}

/* -------------------------------- wiring --------------------------------- */
$('connect').onclick = () => connect(true);
$('connectAll').onclick = () => connect(false);
$('disconnect').onclick = () => { try { device.gatt.disconnect(); } catch (e) {} };
$('clear').onclick = () => { logEl.textContent = ''; };

$('diag').onclick = async () => {
  log('secure context: ' + window.isSecureContext, 'dim');
  log('navigator.bluetooth: ' + (navigator.bluetooth ? 'present' : 'MISSING'), 'dim');
  if (navigator.bluetooth) log('getDevices(): ' + (navigator.bluetooth.getDevices ? 'present' : 'absent'), 'dim');
  log('navigator.requestMIDIAccess: ' + (navigator.requestMIDIAccess ? 'present (Web MIDI)' : 'absent'), 'dim');
  log('UA: ' + navigator.userAgent, 'dim');
  if (navigator.bluetooth && navigator.bluetooth.getDevices) {
    try {
      const g = await navigator.bluetooth.getDevices();
      log('previously granted: ' + (g.length ? g.map((d) => d.name || d.id).join(', ') : '(none)'), 'dim');
    } catch (e) { log('getDevices failed: ' + e.message, 'dim'); }
  }
};

$('note').onclick = async () => {
  await send(Uint8Array.from([0x90, 0x30, 0x64]), 'Note On  ch1 48 v100');
  await sleep(350);
  await send(Uint8Array.from([0x80, 0x30, 0x00]), 'Note Off ch1 48');
};

$('read').onclick = async () => {
  const addr = parseInt($('addr').value, 10) || 0;
  const len = parseInt($('rlen').value, 10) || 16;
  await send(readMsg(addr, len), 'Read 0x11 addr=0x' + addr.toString(16) + ' len=' + len);
  log('  \u2190 ANY reply (even status 1/3) proves R1: BLE speaks the proprietary parser.', 'dim');
};

$('write').onclick = async () => {
  log('test pattern: len 16, 1/16, 120 BPM, slot 15, save=0 (volatile)', 'dim');
  for (const m of testPattern(false)) await send(m, '0x20 write part');
  log('  \u2192 any reply above = R2 passes: the 177-byte write survived BLE.', 'dim');
};
$('writeSave').onclick = async () => {
  log('test pattern: len 16, 1/16, 120 BPM, slot 15, save=1 (PERSISTS to pattern 15)', 'dim');
  for (const m of testPattern(true)) await send(m, '0x20 write part');
  log('  \u2192 then press SEQ/PLAY on the FM-1 to hear it.', 'dim');
};

/* ------------------------------- boot log -------------------------------- */
log('FM-1 BLE-MIDI probe \u2014 service ' + SERVICE_UUID, 'dim');
log('data I/O  ' + IO_CHAR_UUID, 'dim');
if (!window.isSecureContext) log('\u26a0 not a secure context \u2014 Web Bluetooth will refuse', 'err');
if (!navigator.bluetooth) log('\u26a0 navigator.bluetooth missing \u2014 not Chrome/Android, or flag off', 'err');
log('tap Diagnostics first if anything looks odd', 'dim');
</script>
</body>
</html>
